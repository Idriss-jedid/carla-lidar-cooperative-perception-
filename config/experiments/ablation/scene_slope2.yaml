# Sensitivity benchmark, generated scene 'slope2' (slope, seed 2201) by tools/make_sensitivity_scenes.py.
# Every vehicle parked and braked at the spawn plan's pose; only the LiDAR (or, for population
# scenes, the plan variant) changes between runs.
simulation:
  seed: 2201
scenario:
  num_cavs: 4
  num_traffic: 6
  spawn_center: [2.9, -136.5]
  spawn_bbox: [-100, 100, -200, 200]
  spawn_plan: config/spawn_plans/sensitivity/slope2.json
  traffic_blueprint: vehicle.*
  autopilot: false
recording:
  warmup_ticks: 40
  num_frames: 5
  save_every: 2
  camera: none
