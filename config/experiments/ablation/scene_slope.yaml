# Sensitivity analysis, fixed scene "slope": CAVs and vehicles parked on and below the
# 12-degree +x leg of junction 1221 (positions of slope_check, without routes).
scenario:
  num_cavs: 4
  num_traffic: 3
  spawn_center: [40.0, -135.5]
  spawn_bbox: [-100, 100, -200, 200]
  spawn_plan: config/spawn_plans/slope_static.json
  autopilot: false
recording:
  warmup_ticks: 40
  num_frames: 5
  save_every: 2
  camera: none
